<details class="gaussian-disclosure" id="analytical-illustration"><summary>Analytical illustration: prediction can improve while state becomes less available</summary><figure class="gaussian-figure" aria-labelledby="gaussian-title"><div class="figure-head"><div><span class="figure-kicker">ANALYTICAL ILLUSTRATION · NOT EXPERIMENTAL DATA</span><h3 id="gaussian-title">A noncollapsed latent can prefer static nuisance.</h3></div><span class="gaussian-assumption">One-lag predictor · single-snapshot readout</span></div><p class="gaussian-setup">Let <var>sₜ</var> be a stationary unit-Gaussian AR(1) state with correlation <var>ρ</var>, and let <var>b</var> be an unit-Gaussian nuisance independent of the entire state process that stays fixed within an episode. The scalar encoder mixes them:</p><div class="gaussian-formula" aria-label="z t equals square root alpha times s t plus square root one minus alpha times b">zₜ = √α sₜ + √(1 − α) b</div><div class="gaussian-controls"><label for="gaussian-alpha">State mixture <span>α = <output id="gaussian-alpha-value" for="gaussian-alpha">0.50</output></span><input id="gaussian-alpha" type="range" min="0" max="100" value="50" step="1" aria-valuetext="State mixture alpha 0.50"></label><label for="gaussian-rho">State persistence <span>ρ = <output id="gaussian-rho-value" for="gaussian-rho">0.50</output></span><input id="gaussian-rho" type="range" min="0" max="99" value="50" step="1" aria-valuetext="State persistence rho 0.50"></label></div><noscript><p class="gaussian-setup">Static illustration at α = 0.50 and ρ = 0.50. The equations and default curves remain available without JavaScript.</p></noscript><div class="gaussian-chart-wrap"><svg class="gaussian-chart" viewBox="0 0 680 280" role="img" aria-labelledby="gaussian-chart-title gaussian-chart-description"><title id="gaussian-chart-title">Analytical prediction error and state readout across state-mixture weights</title><desc id="gaussian-chart-description">At fixed state persistence rho 0.50, prediction mean squared error is one minus the square of one minus alpha times one minus rho. State readout R squared equals alpha. Both are shown from alpha zero to one. Latent variance remains one throughout.</desc><g class="gaussian-grid"><path d="M58 30H632M58 80H632M58 130H632M58 180H632M58 230H632"/><path d="M58 30V230H632"/></g><g class="gaussian-axis-labels"><text x="43" y="34" text-anchor="end">1.0</text><text x="43" y="134" text-anchor="end">0.5</text><text x="43" y="234" text-anchor="end">0.0</text><text x="58" y="250" text-anchor="middle">0</text><text x="345" y="250" text-anchor="middle">0.5</text><text x="632" y="250" text-anchor="middle">1</text><text x="345" y="275" text-anchor="middle">State mixture α</text></g><path id="gaussian-state-path" class="gaussian-state-line" d="M58 230L632 30"/><path id="gaussian-loss-path" class="gaussian-loss-line" d="M58 230Q345 130 632 80"/><line id="gaussian-selection-line" class="gaussian-selection" x1="345" x2="345" y1="30" y2="230"/><circle id="gaussian-state-point" class="gaussian-state-point" cx="345" cy="130" r="5"/><circle id="gaussian-loss-point" class="gaussian-loss-point" cx="345" cy="142.5" r="5"/></svg><div class="gaussian-legend"><span class="loss-key">Optimal next-latent MSE</span><span class="state-key">Single-snapshot state R²</span></div></div><div class="gaussian-readouts" aria-live="polite" aria-atomic="true"><p><span>Prediction MSE</span><strong id="gaussian-mse">0.438</strong></p><p><span>Single-snapshot R²</span><strong id="gaussian-r2">0.500</strong></p><p><span>Across-episode variance</span><strong>1.000</strong></p></div><p class="gaussian-derivation">Using only <var>zₜ</var>, the optimal predictor is <var>c zₜ</var>, where <var>c = 1 − α + αρ</var>. Its mean squared error is <var>1 − c²</var>. From only zₜ, the optimal current-state readout has <var>R² = α</var>, while <var>Var(zₜ) = 1</var> across episodes for every mixture. Within a fixed episode, Var(zₜ | b) = α.</p><figcaption>All curves follow from this Gaussian model; moving a slider changes no experiment. Lowering α makes next-latent prediction easier while reducing accessible current-state information, without collapsing the marginal. The predictor sees only the previous scalar latent: longer histories, actions and control performance are outside this illustration. The experiments use longer histories, so these curves are not predictions of their learning behavior. This illustrates the known static-nuisance shortcut studied by <a href="https://arxiv.org/html/2211.10831v1">Sobal et al. (2022)</a>, rather than a new theorem.</figcaption></figure></details>
